const FALLBACK_R=[{"id":"r1","title":"Абетка і читання","text":"У польській абетці 32 літери. Більшість читаються майже як українською, але кілька треба запамʼятати одразу. Польська пишеться латиницею й читається <b>досить послідовно<\/b>: вивчивши правила, ви зможете прочитати будь-яке слово.","table":[["Літера","Як звучить","Приклад"],["c","ц","cena — цена"],["w","в","woda — вода"],["ł","ў (як «в» у «вовк» в кінці)","mały — мави"],["y","и","ty — ти"],["i","і (і помʼякшує попередню)","ile — іле"],["e","е","ser — сер"],["j","й","jajko — яйко"],["h / ch","х","herbata — хербата"],["g","ґ","góra — ґура"],["ó","у","ból — буль"]],"ex":[["Dzień dobry!","Добрий день!"],["Mała kawa, proszę.","Маленьку каву, будь ласка."],["Woda i herbata.","Вода і чай."]],"quiz":[["Як читається «ł» у слові «mały»?","Як «ў» (коротке «в»): «мави»."],["Як читається «c» у слові «cena»?","Як «ц»: «цена»."],["Що означає «y» у слові «ty»?","Звук «и»: «ти»."],["Як прочитати «ó» в «ból»?","Як «у»: «буль»."]]},{"id":"r2","title":"Сполучення: sz, cz, rz, ż, ch","text":"Кілька звуків у польській пишуться двома літерами. Важливо: <b>rz<\/b> і <b>ż<\/b> звучать однаково (ж), а <b>ch<\/b> і <b>h<\/b> — однаково (х). Різниця лише в написанні.<br>Після p, t, k, ch сполучення rz звучить як «ш»: przez — пшез, trzy — тши.","table":[["Пишемо","Звучить","Приклад"],["sz","ш","szkoła — шкова"],["cz","ч","czas — час"],["rz","ж","rzeka — жека"],["ż","ж","żona — жона"],["ch","х","chleb — хлеб"],["dz","дз","dzwon — дзвон"],["dż","дж","dżem — джем"],["szcz","шч (щ)","szczęście — шченсьце"]],"ex":[["Czy masz czas?","У тебе є час?"],["Trzy rzeczy.","Три речі."],["Szukam szkoły.","Я шукаю школу."]],"quiz":[["Як звучить «rz» у слові «rzeka»?","Як «ж»: «жека»."],["Як прочитати «trzy»?","«тши» — після t сполучення rz звучить як «ш»."],["Як звучить «cz»?","Як українське «ч»."],["Чи є різниця у вимові «ż» і «rz»?","Ні, обидва — «ж». Різниця лише в правописі."]]},{"id":"r3","title":"Мʼякі звуки: ć, ś, ź, ń, dź","text":"У польській є мʼякі звуки, яких немає в українській у такому вигляді. Вони пишуться <b>двома способами<\/b>: з рискою (ć, ś, ź, ń, dź) — перед приголосним і в кінці слова, або через <b>i<\/b> (ci, si, zi, ni, dzi) — перед голосним. Звучать вони мʼякше за ч, ш, ж: щось середнє між «ць» і «ч», «сь» і «щ».","table":[["З рискою","Перед голосним","Приклад"],["ć","ci","ćma, ciocia"],["ś","si","ślub, siostra"],["ź","zi","źle, zima"],["ń","ni","koń, nie"],["dź","dzi","łódź, dziecko"]],"ex":[["Dziękuję, ciociu!","Дякую, тітонько!"],["Siostra ma dziecko.","Сестра має дитину."],["Zima jest zimna.","Зима холодна."]],"quiz":[["Як інакше записується звук «ś» перед голосним?","Як «si»: siostra."],["Чому в слові «nie» немає «ń»?","Бо перед голосним мʼякість позначає «i»: ni + e."],["Як читається «ci» в «ciocia»?","Мʼяко — звук між «ць» і «ч» (так само, як ć)."],["Що означає «źle»?","Погано (ź — мʼяке «жь»)."]]},{"id":"r4","title":"Носові ą, ę і літера ó","text":"<b>ą<\/b> і <b>ę<\/b> — носові голосні. Спрощене правило: <b>ą<\/b> ≈ «он», <b>ę<\/b> ≈ «ен»; перед b і p — «ом» / «ем». У кінці слова <b>ę<\/b> звучить майже як звичайне «е», а <b>ą<\/b> — як носове «оу».<br><b>ó<\/b> завжди читається як «у» (так само, як u).","table":[["Слово","Читається","Переклад"],["ręka","ренка","рука"],["mąż","монж","чоловік"],["ząb","зомп","зуб"],["proszę","проше","прошу"],["są","соу","є (вони є)"],["Kraków","кракув","Краків"]],"ex":[["Dziękuję bardzo.","Дуже дякую."],["Mąż ma rękę w gipsie.","У чоловіка рука в гіпсі."],["Mieszkam w Krakowie.","Я живу в Кракові."]],"quiz":[["Як прочитати «ręka»?","«ренка»."],["Як звучить «ę» в кінці «proszę»?","Майже як звичайне «е»: «проше»."],["Чим відрізняються «ó» і «u» у вимові?","Нічим — обидві звучать як «у»."],["Як прочитати «ząb»?","«зомп» — перед b носове «ą» звучить як «ом», а b у кінці глухне."]]},{"id":"r5","title":"Наголос","text":"Найпростіше правило польської: наголос майже завжди на <b>передостанньому складі<\/b>. Не треба вчити наголос кожного слова окремо!<br>Винятки: форми минулого часу на -liśmy / -liście (BY-liśmy), умовний спосіб і деякі слова іншомовного походження на -yka (ma-TE-ma-ty-ka).","table":[["Слово","Склади","Наголос"],["Warszawa","War-sza-wa","ША"],["dziękuję","dzię-ku-ję","КУ"],["telefon","te-le-fon","ЛЕ"],["mieszkanie","miesz-ka-nie","КА"],["uniwersytet","u-ni-wer-sy-tet","СИ"]],"ex":[["Warszawa to stolica Polski.","Варшава — столиця Польщі."],["Mam nowy telefon.","У мене новий телефон."],["Szukam mieszkania.","Я шукаю квартиру."]],"quiz":[["Де наголос у слові «telefon»?","На «le»: te-LE-fon."],["Де наголос у слові «Polska»?","На першому складі: POL-ska (передостанній із двох)."],["Де наголос у «kobieta»?","ko-BIE-ta."],["Що буде з наголосом, коли слово стає довшим?","Він пересувається, щоб лишитися на передостанньому складі: te-LE-fon → te-le-FO-nem."]]},{"id":"r6","title":"Особові займенники","text":"Займенники схожі на українські. Але в польській їх часто <b>пропускають<\/b>, бо особу видно із закінчення дієслова: <i>Mieszkam w Polsce<\/i> = Я живу в Польщі.<br><b>oni<\/b> — група, де є хоч один чоловік; <b>one<\/b> — лише жінки, діти, тварини, речі.<br>Ввічливо до однієї людини — <b>pan<\/b> (чоловік) / <b>pani<\/b> (жінка), до групи — <b>państwo<\/b>.","table":[["Однина","Множина"],["ja — я","my — ми"],["ty — ти","wy — ви"],["on — він","oni — вони (з чоловіками)"],["ona — вона","one — вони (без чоловіків)"],["ono — воно","państwo — ви (ввічливо, група)"]],"ex":[["Ja jestem z Ukrainy, a ty?","Я з України, а ти?"],["Oni mieszkają w Gdańsku.","Вони живуть у Гданську."],["One są w szkole.","Вони (дівчата) у школі."]],"quiz":[["Як сказати «вони» про трьох жінок?","one"],["Як сказати «вони» про чоловіка і двох жінок?","oni"],["Як ввічливо звернутися до незнайомої жінки?","pani: Czy pani wie...?"],["Чи обовʼязково казати «ja» перед дієсловом?","Ні, зазвичай пропускають: Mieszkam tu."]]},{"id":"r7","title":"Дієслово być (бути)","text":"На відміну від української, в польській дієслово «бути» в теперішньому часі <b>не пропускають<\/b>: «Я втомлений» = <i>Jestem zmęczony<\/i>.<br>Для «це» використовують <b>to jest<\/b> / <b>to są<\/b>: To jest mój dom.","table":[["Особа","Форма","Приклад"],["ja","jestem","Jestem w domu."],["ty","jesteś","Jesteś głodny?"],["on / ona / ono","jest","Ona jest miła."],["my","jesteśmy","Jesteśmy gotowi."],["wy","jesteście","Gdzie jesteście?"],["oni / one","są","Oni są z Polski."]],"ex":[["Jestem z Ukrainy.","Я з України."],["To jest mój brat.","Це мій брат."],["Gdzie jesteś?","Де ти?"]],"quiz":[["Як сказати «Ми вдома»?","Jesteśmy w domu."],["Як сказати «Де ти?»","Gdzie jesteś?"],["Яка форма для «вони»?","są"],["Перекладіть «Це моя сестра».","To jest moja siostra."]]},{"id":"r8","title":"Дієслово mieć і «у мене є / немає»","text":"«У мене є» по-польськи — <b>mam<\/b> (дослівно «я маю»). А «немає» — <b>nie ma<\/b> + родовий відмінок. Після «nie mam» слово теж переходить у родовий: mam czas → nie mam czasu.","table":[["Особа","mieć","Заперечення"],["ja","mam","nie mam"],["ty","masz","nie masz"],["on / ona","ma","nie ma"],["my","mamy","nie mamy"],["wy","macie","nie macie"],["oni / one","mają","nie mają"]],"ex":[["Mam dwa bilety.","У мене два квитки."],["Nie mam czasu.","У мене немає часу."],["Nie ma chleba.","Немає хліба."],["Masz pytanie?","У тебе є запитання?"]],"quiz":[["Як сказати «У мене є машина»?","Mam samochód."],["Як сказати «Тут немає води»?","Tu nie ma wody."],["Яка форма mieć для «ми»?","mamy"],["Як сказати «У них немає грошей»?","Nie mają pieniędzy."]]},{"id":"r9","title":"Рід іменників","text":"Як і в українській, у польській три роди. Здебільшого рід видно за закінченням:<br><b>чоловічий<\/b> — на приголосний; <b>жіночий<\/b> — на -a (а також деякі на -ść, -ć, -l: noc, miłość, sól); <b>середній<\/b> — на -o, -e, -ę, -um.<br>Увага: деякі слова на -a — чоловічого роду, бо означають чоловіків: mężczyzna, kierowca, tata.","table":[["Рід","Закінчення","Приклади"],["чоловічий","приголосний","dom, stół, telefon"],["жіночий","-a (-ść, -ć)","kawa, mama, noc"],["середній","-o, -e, -ę","okno, morze, imię"],["виняток (ч.)","-a","tata, kierowca"]],"ex":[["To jest nowy dom.","Це новий будинок."],["To jest nowa kawiarnia.","Це нова кавʼярня."],["To jest nowe okno.","Це нове вікно."]],"quiz":[["Який рід у слова «mieszkanie»?","Середній (закінчення -e)."],["Який рід у слова «kierowca»?","Чоловічий — це чоловік, хоч закінчення -a."],["Який рід у слова «noc»?","Жіночий."],["Який рід у слова «krzesło»?","Середній (на -o), хоч українське «стілець» — чоловічого."]]},{"id":"r10","title":"Прикметники і рід","text":"Прикметник узгоджується з іменником у роді: <b>-y / -i<\/b> (чоловічий), <b>-a<\/b> (жіночий), <b>-e<\/b> (середній). -i пишемо після k, g і мʼяких: tani, drogi.<br>Зверніть увагу: рід у польській і українській часто збігається, але не завжди: <i>ta ulica<\/i> (ж.) — «ця вулиця», <i>to krzesło<\/i> (с.) — «цей стілець».","table":[["Чоловічий","Жіночий","Середній"],["dobry dom","dobra kawa","dobre piwo"],["tani bilet","tania kurtka","tanie mieszkanie"],["drogi hotel","droga torba","drogie wino"],["ten pokój","ta kuchnia","to okno"]],"ex":[["To jest bardzo dobra zupa.","Це дуже добрий суп."],["Mam nowe mieszkanie.","У мене нова квартира."],["Ten autobus jest pełny.","Цей автобус повний."]],"quiz":[["Як буде «дешева кава»?","tania kawa"],["Узгодьте: «nowy» + «okno».","nowe okno"],["Як буде «цей стілець»?","to krzesło (середній рід)"],["Як буде «велика кімната» (pokój — ч. р.)?","duży pokój"]]},{"id":"r11","title":"Теперішній час: групи дієслів","text":"Дієслова в теперішньому часі змінюються за особами. Є чотири основні типи — визначайте їх за формами <b>ja<\/b> і <b>ty<\/b>. Майже всі дієслова в «ja» закінчуються на <b>-m<\/b> або <b>-ę<\/b>.","table":[["Особа","czytać (-am)","rozumieć (-em)","mówić (-ę/-isz)","pracować (-uję)"],["ja","czytam","rozumiem","mówię","pracuję"],["ty","czytasz","rozumiesz","mówisz","pracujesz"],["on/ona","czyta","rozumie","mówi","pracuje"],["my","czytamy","rozumiemy","mówimy","pracujemy"],["wy","czytacie","rozumiecie","mówicie","pracujecie"],["oni/one","czytają","rozumieją","mówią","pracują"]],"ex":[["Czytam książkę.","Я читаю книжку."],["Nie rozumiem.","Я не розумію."],["Mówisz po polsku?","Ти говориш польською?"],["Oni pracują w Warszawie.","Вони працюють у Варшаві."]],"quiz":[["Утворіть форму «ja» від «mieszkać».","mieszkam"],["Утворіть форму «oni» від «mówić».","mówią"],["Утворіть форму «my» від «pracować».","pracujemy"],["Як сказати «Ти розумієш?»","Rozumiesz?"],["До якого типу належить «kupować»?","Як pracować: kupuję, kupujesz."]]},{"id":"r12","title":"Заперечення і запитання","text":"<b>Nie<\/b> ставимо перед дієсловом: Nie wiem, Nie mam czasu. Як і в українській, заперечення <b>подвійне<\/b>: Nikt nic nie wie — Ніхто нічого не знає.<br>Запитання «так/ні» починають із <b>czy<\/b> (не перекладається) або просто підвищують інтонацію. Інші запитання — з питальних слів: co, kto, gdzie, kiedy, jak, ile, dlaczego.","table":[["Твердження","Запитання","Заперечення"],["Masz czas.","Czy masz czas?","Nie masz czasu."],["On jest w domu.","Czy on jest w domu?","On nie jest w domu."],["Lubisz kawę.","Czy lubisz kawę?","Nie lubisz kawy."]],"ex":[["Czy pan tu mieszka?","Ви тут живете?"],["Nigdy nie piję kawy.","Я ніколи не пʼю кави."],["Gdzie jest przystanek?","Де зупинка?"]],"quiz":[["Як сказати «Я не знаю»?","Nie wiem."],["Зробіть запитання: «Ona jest lekarką».","Czy ona jest lekarką?"],["Перекладіть «Ніхто не дзвонить».","Nikt nie dzwoni."],["Чи перекладається «czy» на початку запитання?","Ні, це лише сигнал запитання."]]},{"id":"r13","title":"Множина іменників","text":"Множина утворюється за родом і останньою літерою:<br><b>-y<\/b> після твердих приголосних (kawa → kawy, dom → domy); <b>-i<\/b> після k, g (noga → nogi, książka → książki); <b>-e<\/b> після мʼяких і cz, sz, rz, c (klucz → klucze, ulica → ulice); <b>-a<\/b> у середньому роді (okno → okna).<br>Чоловіки-особи мають окремі форми: student → studenci, Polak → Polacy, pan → panowie.","table":[["Однина","Множина","Правило"],["kawa","kawy","-y"],["książka","książki","-i після k"],["klucz","klucze","-e після cz"],["okno","okna","середній: -a"],["student","studenci","чоловіки-особи"],["dziecko","dzieci","виняток"],["człowiek","ludzie","виняток"]],"ex":[["Mam dwa klucze.","У мене два ключі."],["Dzieci są w szkole.","Діти в школі."],["Te książki są ciekawe.","Ці книжки цікаві."]],"quiz":[["Множина від «mieszkanie»?","mieszkania"],["Множина від «torba»?","torby"],["Множина від «noga»?","nogi"],["Множина від «człowiek»?","ludzie"]]},{"id":"r14","title":"Відмінки: загальна картина","text":"Добра новина: у польській ті самі <b>7 відмінків<\/b>, що й в українській, і їх логіка дуже схожа. Відрізняються переважно закінчення. Польські назви варто знати — їх використовують у підручниках і словниках.","table":[["Польська назва","Українська","Питання"],["mianownik","називний","kto? co?"],["dopełniacz","родовий","kogo? czego?"],["celownik","давальний","komu? czemu?"],["biernik","знахідний","kogo? co?"],["narzędnik","орудний","z kim? z czym?"],["miejscownik","місцевий","o kim? o czym?"],["wołacz","кличний","o!"]],"ex":[["To jest kawa.","Це кава. (називний)"],["Nie ma kawy.","Немає кави. (родовий)"],["Piję kawę.","Я пʼю каву. (знахідний)"],["Herbata z cytryną.","Чай з лимоном. (орудний)"]],"quiz":[["Як по-польськи називається родовий відмінок?","dopełniacz"],["Скільки відмінків у польській?","Сім."],["На яке питання відповідає narzędnik?","z kim? z czym? (ким? чим?)"],["Який відмінок у «Piję kawę»?","biernik — знахідний."]]},{"id":"r15","title":"Знахідний відмінок (biernik)","text":"Відповідає на питання <b>kogo? co?<\/b> після більшості дієслів: mam, lubię, kupuję, widzę, znam, poproszę.<br><b>Жіночий<\/b> -a → <b>-ę<\/b> (kawa → kawę); прикметник → <b>-ą<\/b> (dobrą kawę). Виняток: pani → panią.<br><b>Чоловічий неживий<\/b> і <b>середній<\/b> не змінюються: mam telefon, mam mieszkanie.<br><b>Чоловічий живий<\/b> отримує <b>-a<\/b>: mam brata, mam psa.","table":[["Називний","Знахідний","Приклад"],["kawa","kawę","Poproszę kawę."],["mama","mamę","Kocham mamę."],["dom","dom","Mam dom."],["okno","okno","Otwórz okno."],["brat","brata","Mam brata."],["pies","psa","Mam psa."]],"ex":[["Poproszę dużą kawę.","Велику каву, будь ласка."],["Znasz Marka?","Ти знаєш Марка?"],["Kupuję chleb i wodę.","Я купую хліб і воду."]],"quiz":[["Поставте у знахідний: «Lubię (herbata)».","Lubię herbatę."],["«Mam (kot)» — як правильно?","Mam kota."],["«Mam (samochód)» — як правильно?","Mam samochód (неживий — без змін)."],["«Widzę (pani)» — як правильно?","Widzę panią."]]},{"id":"r16","title":"Родовий відмінок (dopełniacz)","text":"Один із найчастіших відмінків. Вживається:<br>• після <b>nie ma<\/b> і заперечення: Nie ma mleka, Nie mam czasu;<br>• після кількості: dużo, mało, kilo, butelka: butelka wody;<br>• після прийменників <b>do, od, z (звідки), bez, dla, u, obok<\/b>;<br>• після дієслів szukać, potrzebować, słuchać, bać się, uczyć się.<br>Закінчення: жін. <b>-y/-i<\/b>; сер. <b>-a<\/b>; чол. <b>-a<\/b> (живі й частина неживих) або <b>-u<\/b> (багато неживих — треба запамʼятовувати). Прикметник: -ego (ч., с.), -ej (ж.).","table":[["Називний","Родовий","Приклад"],["woda","wody","Nie ma wody."],["mleko","mleka","Kawa bez mleka."],["brat","brata","Idę do brata."],["chleb","chleba","Kilo chleba."],["dom","domu","Idę do domu."],["czas","czasu","Nie mam czasu."]],"ex":[["Nie ma ciepłej wody.","Немає гарячої води."],["Szukam pracy.","Я шукаю роботу."],["Idę do lekarza.","Я йду до лікаря."],["Herbata bez cukru.","Чай без цукру."]],"quiz":[["«Nie mam (pieniądze)» — як правильно?","Nie mam pieniędzy."],["«Szukam (apteka)» — як правильно?","Szukam apteki."],["«Butelka (wino)» — як правильно?","butelka wina"],["Чому «Lubię kawę», але «Nie lubię kawy»?","Після заперечення знахідний переходить у родовий."]]},{"id":"r17","title":"Орудний відмінок (narzędnik)","text":"Відповідає на питання <b>kim? czym?<\/b>. Закінчення: чол. і сер. <b>-em<\/b> (-iem після k, g), жін. <b>-ą<\/b>; множина <b>-ami<\/b>.<br>Вживається:<br>• <b>jestem + професія / національність<\/b>: Jestem lekarzem, On jest Polakiem;<br>• <b>z + орудний<\/b> = з кимось / з чимось: z mamą, z mlekiem;<br>• транспорт: jadę autobusem;<br>• після przed, za, nad, pod, między (де?).<br>Увага: з «to» — називний: To jest lekarz. Лише прикметник — теж називний: Jestem zmęczony.","table":[["Називний","Орудний","Приклад"],["lekarz","lekarzem","Jestem lekarzem."],["Ukrainka","Ukrainką","Jestem Ukrainką."],["mleko","mlekiem","Kawa z mlekiem."],["tramwaj","tramwajem","Jadę tramwajem."],["kolega","kolegą","Idę z kolegą."],["dzieci","dziećmi","Jestem z dziećmi."]],"ex":[["Jestem kierowcą.","Я водій."],["Mieszkam z żoną.","Я живу з дружиною."],["Jadę do pracy rowerem.","Я їду на роботу велосипедом."]],"quiz":[["Як сказати «Я програміст» (programista)?","Jestem programistą."],["«Kawa z (cukier)» — як правильно?","Kawa z cukrem."],["«Jadę (pociąg)» — як правильно?","Jadę pociągiem."],["«Jestem (zmęczony)» — чи змінюється слово?","Ні, з одним прикметником — називний."]]},{"id":"r18","title":"Місцевий відмінок (miejscownik)","text":"Завжди з прийменником: <b>w, na, o, po, przy<\/b>. Відповідає на «де?» і «про що?».<br>Найчастіше закінчення <b>-e<\/b> з чергуванням приголосного: Kraków → w Krakowie, miasto → w mieście, Polska → w Polsce, biuro → w biurze.<br>Після k, g, ch і мʼяких — <b>-u<\/b> (ч., с.): w banku, w hotelu, w mieszkaniu. Жіночі на -ia, -ca, -ja — <b>-i/-y<\/b>: w kuchni, na ulicy. Прикметник: -ym/-im (ч., с.), -ej (ж.).","table":[["Називний","Місцевий","Приклад"],["Warszawa","Warszawie","w Warszawie"],["Polska","Polsce","w Polsce"],["sklep","sklepie","w sklepie"],["stół","stole","na stole"],["bank","banku","w banku"],["dom","domu","w domu"],["kuchnia","kuchni","w kuchni"]],"ex":[["Mieszkam w Polsce.","Я живу в Польщі."],["Klucze są na stole.","Ключі на столі."],["Mówimy o pracy.","Ми говоримо про роботу."],["Pracuję w dużej firmie.","Я працюю у великій компанії."]],"quiz":[["«Mieszkam w (Kraków)» — як правильно?","w Krakowie"],["«Jestem w (szkoła)» — як правильно?","w szkole"],["«Pracuję w (biuro)» — як правильно?","w biurze"],["«Kawa jest w (kuchnia)» — як правильно?","w kuchni"]]},{"id":"r19","title":"Давальний відмінок (celownik)","text":"Відповідає на <b>komu? czemu?<\/b> — кому даємо, допомагаємо, дякуємо.<br>Закінчення: чол. <b>-owi<\/b> (Markowi, synowi; винятки: panu, bratu, ojcu); жін. — як у місцевому (mamie, Annie, pani); сер. <b>-u<\/b> (dziecku).<br>Дуже часті займенники: <b>mi, ci, mu, jej, nam, wam, im<\/b>. Вирази: Podoba mi się (мені подобається), Jest mi zimno (мені холодно).","table":[["Хто?","Кому?","Приклад"],["ja","mi / mnie","Daj mi wodę."],["ty","ci / tobie","Dziękuję ci."],["on","mu / jemu","Pomagam mu."],["ona","jej","Daję jej prezent."],["Marek","Markowi","Dziękuję Markowi."],["mama","mamie","Pomagam mamie."]],"ex":[["Podoba mi się Kraków.","Мені подобається Краків."],["Jest mi zimno.","Мені холодно."],["Daję dziecku jabłko.","Я даю дитині яблуко."]],"quiz":[["Як сказати «Мені подобається ця кава»?","Podoba mi się ta kawa."],["«Pomagam (brat)» — як правильно?","Pomagam bratu."],["Як сказати «Мені холодно»?","Jest mi zimno. / Zimno mi."],["«Dziękuję (pan)» — як правильно?","Dziękuję panu."]]},{"id":"r20","title":"Кличний відмінок (wołacz)","text":"Використовується, коли звертаємося до когось. Особливо важливий у <b>ввічливих звертаннях<\/b>: <i>Panie Marku!<\/i>, <i>Pani Anno!<\/i><br>Жіночі на -a → <b>-o<\/b>: Anna → Anno, mama → mamo (але pani → pani). Чоловічі → <b>-e<\/b> або <b>-u<\/b>: pan → panie, Paweł → Pawle, Marek → Marku, syn → synu.<br>У розмові з друзями часто кажуть просто імʼя: Ania, chodź!","table":[["Називний","Кличний","Приклад"],["pan","panie","Panie doktorze!"],["pani","pani","Pani Ewo!"],["Anna","Anno","Anno, pomóż mi!"],["Marek","Marku","Dzień dobry, panie Marku!"],["Paweł","Pawle","Pawle, chodź tu!"],["mama","mamo","Mamo, gdzie jesteś?"]],"ex":[["Dzień dobry, pani Ewo!","Добрий день, пані Єво!"],["Mamo, jestem w domu!","Мамо, я вдома!"],["Szanowna Pani,","Шановна пані, (початок листа)"]],"quiz":[["Як звернутися до пана Марека?","Panie Marku!"],["Кличний від «Anna»?","Anno"],["Як почати офіційний лист до чоловіка?","Szanowny Panie,"],["Кличний від «Paweł»?","Pawle"]]},{"id":"r21","title":"Числівники та іменники після них","text":"Після числівника форма іменника залежить від числа — майже як в українській:<br>• <b>1<\/b> — називний однини: jeden bilet, jedna kawa, jedno piwo;<br>• <b>2, 3, 4<\/b> (і 22–24, 32–34…) — називний множини: dwa bilety, trzy kawy. Для жіночого роду — <b>dwie<\/b>: dwie kawy;<br>• <b>5 і більше<\/b> (а також 12–14) — родовий множини: pięć biletów, pięć kaw.<br>Так само з грошима і віком: 1 złoty, 2 złote, 5 złotych; 1 rok, 2 lata, 5 lat.","table":[["1","2–4","5+"],["jeden bilet","dwa bilety","pięć biletów"],["jedna kawa","dwie kawy","pięć kaw"],["jeden złoty","dwa złote","pięć złotych"],["jeden rok","dwa lata","pięć lat"]],"ex":[["Poproszę dwie kawy.","Дві кави, будь ласка."],["To kosztuje dwadzieścia złotych.","Це коштує двадцять злотих."],["Mam trzydzieści cztery lata.","Мені тридцять чотири роки."]],"quiz":[["«3 + bilet» = ?","trzy bilety"],["«5 + złoty» = ?","pięć złotych"],["«2 + kawa» = ?","dwie kawy"],["Як сказати «Мені 25 років»?","Mam dwadzieścia pięć lat."]]},{"id":"r22","title":"Котра година, дні та дати","text":"Години називають <b>порядковими числівниками жіночого роду<\/b> (бо «godzina» — жіночого роду): Jest pierwsza, druga, trzecia…<br>«О котрій?» — <b>o<\/b> + місцевий відмінок: o pierwszej, o drugiej, o piątej.<br>Пів години — <b>wpół do<\/b> + наступна година: wpół do ósmej = 7:30. Також можна просто: siódma trzydzieści.<br>Дні тижня: <b>w<\/b> + знахідний: w poniedziałek, we wtorek, w środę. Дати — родовий: pierwszego maja.","table":[["Час","Як сказати"],["8:00","ósma / o ósmej"],["8:15","kwadrans po ósmej / ósma piętnaście"],["8:30","wpół do dziewiątej / ósma trzydzieści"],["8:45","za kwadrans dziewiąta"],["1 травня","pierwszego maja"]],"ex":[["Która jest godzina? Jest trzecia.","Котра година? Третя."],["Spotkajmy się o siódmej.","Зустріньмося о сьомій."],["Mam wizytę w czwartek o dziesiątej.","У мене прийом у четвер о десятій."]],"quiz":[["Як сказати «о пʼятій»?","o piątej"],["Як сказати 6:30 (через «wpół do»)?","wpół do siódmej"],["Як сказати «у середу»?","w środę"],["Як сказати «Котра година?»","Która jest godzina?"]]},{"id":"r23","title":"Ввічливі форми: Pan, Pani, Państwo","text":"Головна відмінність від української: до незнайомих, у магазині, урядах, на роботі (поки не перейшли на «ти») звертаються <b>не на «wy»<\/b>, а через <b>pan / pani / państwo<\/b> + дієслово в 3-й особі.<br>«Wy» до однієї людини звучить застаріло або грубувато. <b>Państwo<\/b> — до групи або пари, дієслово в 3-й особі множини.<br>Щоб привернути увагу: <i>Proszę pana! / Proszę pani!<\/i> Перехід на «ти»: <i>Mówmy sobie po imieniu.<\/i>","table":[["Українською","Польською"],["Ви знаєте? (чол.)","Czy pan wie?"],["Ви знаєте? (жін.)","Czy pani wie?"],["Ви знаєте? (група)","Czy państwo wiedzą?"],["Дякую вам (чол.)","Dziękuję panu."],["Для вас (жін.)","Dla pani."]],"ex":[["Czy może mi pan pomóc?","Ви можете мені допомогти?"],["Proszę pani, gdzie jest kasa?","Перепрошую, пані, де каса?"],["Czego państwo szukają?","Що ви шукаєте?"]],"quiz":[["Як ввічливо запитати жінку «Ви тут працюєте?»","Czy pani tu pracuje?"],["Як звернутися до групи людей?","państwo + дієслово в 3-й особі множини."],["Як запропонувати перейти на «ти»?","Mówmy sobie po imieniu."],["Чи можна сказати «Czy wy wiecie?» незнайомій людині?","Краще ні — це «ви» до кількох людей; до однієї — pan / pani."]]},{"id":"r24","title":"Минулий час","text":"Утворюється від основи інфінітива + <b>-ł-<\/b> + закінчення, що залежать від <b>роду<\/b>, як в українській (робив / робила). Але в польській до форми ще додається закінчення особи: robiłem = я робив.<br>Важливо: чоловіки кажуть <b>-łem<\/b>, жінки — <b>-łam<\/b>.<br>У множині: <b>-li<\/b> (група з чоловіками) і <b>-ły<\/b> (інші).","table":[["Особа","Чоловік","Жінка"],["ja","robiłem","robiłam"],["ty","robiłeś","robiłaś"],["on / ona","robił","robiła"],["my","robiliśmy","robiłyśmy"],["wy","robiliście","robiłyście"],["oni / one","robili","robiły"]],"ex":[["Wczoraj byłem u lekarza.","Учора я був у лікаря."],["Gdzie byłaś?","Де ти була?"],["Kupiliśmy nowe mieszkanie.","Ми купили нову квартиру."],["Poszedłem do sklepu.","Я пішов у магазин."]],"quiz":[["«Я працював» (чоловік) = ?","pracowałem"],["«Я працювала» (жінка) = ?","pracowałam"],["«Вони були» (чоловіки) = ?","byli"],["Минулий час від «iść» для «він»?","szedł (неправильна форма)"]]},{"id":"r25","title":"Майбутній час","text":"Є два способи, залежно від виду дієслова:<br>• <b>недоконаний<\/b>: <b>będę<\/b> + інфінітив або форма минулого часу: będę pracować / będę pracował — я працюватиму;<br>• <b>доконаний<\/b>: форма «теперішнього» часу вже означає майбутнє: zrobię — я зроблю, kupię — я куплю.<br>«Бути» в майбутньому — просто będę: Jutro będę w domu.","table":[["Особа","być","Приклад"],["ja","będę","Będę jutro."],["ty","będziesz","Będziesz w domu?"],["on / ona","będzie","Będzie padać."],["my","będziemy","Będziemy czekać."],["wy","będziecie","Gdzie będziecie?"],["oni / one","będą","Będą o piątej."]],"ex":[["Jutro będzie zimno.","Завтра буде холодно."],["Będę pracować w sobotę.","Я працюватиму в суботу."],["Zadzwonię wieczorem.","Я подзвоню ввечері."]],"quiz":[["«Я буду вдома» = ?","Będę w domu."],["«Я куплю хліб» = ?","Kupię chleb."],["«Ми чекатимемо» = ?","Będziemy czekać."],["Що означає «napiszę»?","Я напишу (майбутній час, бо дієслово доконане)."]]},{"id":"r26","title":"Вид дієслова","text":"Як і в українській, більшість дієслів мають пару: <b>недоконаний<\/b> вид (процес, повторення: робити) і <b>доконаний<\/b> (результат, одна дія: зробити). Логіка майже така сама, як в українській, — це велика перевага!<br>Доконані часто утворюються префіксом (z-, na-, prze-, wy-), але бувають і зовсім різні слова.","table":[["Недоконаний","Доконаний","Переклад"],["robić","zrobić","робити / зробити"],["pisać","napisać","писати / написати"],["czytać","przeczytać","читати / прочитати"],["kupować","kupić","купувати / купити"],["brać","wziąć","брати / взяти"],["mówić","powiedzieć","говорити / сказати"],["widzieć","zobaczyć","бачити / побачити"]],"ex":[["Codziennie kupuję chleb.","Я щодня купую хліб."],["Jutro kupię nowy telefon.","Завтра я куплю новий телефон."],["Czytałem tę książkę.","Я читав цю книжку."],["Przeczytałem tę książkę.","Я прочитав цю книжку."]],"quiz":[["Доконаний вид до «pić»?","wypić"],["Доконаний вид до «brać»?","wziąć"],["Що означає «zrobię»?","Я зроблю (майбутній)."],["Чи можна сказати «teraz kupię» про процес у цю мить?","Ні, для процесу зараз — teraz kupuję."]]},{"id":"r27","title":"Дієслова руху: iść, chodzić, jechać, jeździć","text":"Поляки чітко розрізняють <b>пішки<\/b> і <b>транспортом<\/b>: iść (пішки) / jechać (їхати). Якщо ви їдете з Варшави до Кракова, кажіть тільки jechać!<br><b>iść / jechać<\/b> — зараз, в один бік; <b>chodzić / jeździć<\/b> — регулярно або взагалі.","table":[["Особа","iść","jechać","chodzić","jeździć"],["ja","idę","jadę","chodzę","jeżdżę"],["ty","idziesz","jedziesz","chodzisz","jeździsz"],["on/ona","idzie","jedzie","chodzi","jeździ"],["my","idziemy","jedziemy","chodzimy","jeździmy"],["wy","idziecie","jedziecie","chodzicie","jeździcie"],["oni","idą","jadą","chodzą","jeżdżą"]],"ex":[["Idę do sklepu.","Я йду в магазин (зараз)."],["Codziennie chodzę do pracy.","Я щодня ходжу на роботу."],["Jutro jadę do Gdańska.","Завтра я їду до Гданська."],["Często jeżdżę rowerem.","Я часто їжджу велосипедом."]],"quiz":[["«Я їду (зараз) на роботу автобусом» = ?","Jadę do pracy autobusem."],["«Діти ходять до школи» = ?","Dzieci chodzą do szkoły."],["Як сказати «Ми їдемо до Польщі»?","Jedziemy do Polski."],["Як буде «піти» (доконаний до iść)?","pójść"]]},{"id":"r28","title":"Де? Куди? Звідки?","text":"Прийменники працюють <b>парами<\/b>. Запамʼятайте три стовпчики:<br>• <b>w<\/b> (де) ↔ <b>do<\/b> (куди) ↔ <b>z<\/b> (звідки) — для закритих місць, міст, країн;<br>• <b>na<\/b> (де, + місцевий) ↔ <b>na<\/b> (куди, + знахідний) ↔ <b>z<\/b> — для пошти, вокзалу, концерту, урядів, «відкритих» місць;<br>• <b>u<\/b> (у когось) ↔ <b>do<\/b> ↔ <b>od<\/b> — для людей.","table":[["Де?","Куди?","Звідки?"],["w domu","do domu","z domu"],["w Polsce","do Polski","z Polski"],["na poczcie","na pocztę","z poczty"],["na dworcu","na dworzec","z dworca"],["u lekarza","do lekarza","od lekarza"]],"ex":[["Jestem u lekarza.","Я в лікаря."],["Idę na pocztę.","Я йду на пошту."],["Wracam z pracy.","Я повертаюся з роботи."],["Jadę nad morze.","Я їду на море."]],"quiz":[["«Я йду до мами» = ?","Idę do mamy."],["«Я на вокзалі» = ?","Jestem na dworcu."],["«Я йду на пошту» = ?","Idę na pocztę."],["«Я повертаюся від лікаря» = ?","Wracam od lekarza."]]},{"id":"r29","title":"Дієслова з się","text":"<b>Się<\/b> — це польське «-ся», але пишеться <b>окремим словом<\/b> і однакове для всіх осіб: myję się, myjesz się, myje się.<br>Się не обовʼязково стоїть після дієслова — часто воно перед ним: <i>Jak się nazywasz?<\/i>, <i>Nie boję się<\/i>.<br>Іноді «się» є в польській, а в українській немає, і навпаки.","table":[["Польською","Українською"],["nazywać się","називатися"],["uczyć się","учитися"],["podobać się","подобатися"],["bać się","боятися"],["śmiać się","сміятися"],["czuć się","почуватися"],["wydaje mi się","мені здається"]],"ex":[["Jak się nazywasz?","Як тебе звати?"],["Czuję się dobrze.","Я почуваюся добре."],["Podoba mi się to miasto.","Мені подобається це місто."]],"quiz":[["«Я вчуся» = ?","Uczę się."],["«Не бійся!» = ?","Nie bój się!"],["«Як ви почуваєтеся?» (до чоловіка) = ?","Jak się pan czuje?"],["Чи змінюється «się» за особами?","Ні, завжди się."]]},{"id":"r30","title":"Musieć, móc, chcieć, trzeba, można","text":"Ці дієслова поєднуються з <b>інфінітивом<\/b>: muszę iść, mogę pomóc, chcę jeść.<br>Безособові слова: <b>trzeba<\/b> (треба), <b>można<\/b> (можна), <b>nie wolno<\/b> (не можна, заборонено). Ввічливе прохання: <i>Czy mogę…?<\/i> — Чи можна мені…?","table":[["Особа","musieć","móc","chcieć"],["ja","muszę","mogę","chcę"],["ty","musisz","możesz","chcesz"],["on/ona","musi","może","chce"],["my","musimy","możemy","chcemy"],["wy","musicie","możecie","chcecie"],["oni","muszą","mogą","chcą"]],"ex":[["Muszę iść do urzędu.","Мені треба піти в установу."],["Czy mogę zapłacić kartą?","Можна заплатити карткою?"],["Tu nie wolno palić.","Тут не можна палити."],["Trzeba kupić bilet.","Треба купити квиток."]],"quiz":[["«Я мушу працювати» = ?","Muszę pracować."],["«Можна ввійти?» = ?","Czy mogę wejść? / Czy można wejść?"],["«Вони хочуть їсти» = ?","Chcą jeść."],["«Тут не можна паркуватися» = ?","Tu nie wolno parkować."]]},{"id":"r31","title":"Порівняння: lepszy, tańszy, najlepszy","text":"Вищий ступінь: <b>-szy<\/b> або <b>-iejszy/-ejszy<\/b>; найвищий — <b>naj-<\/b> + вищий ступінь. «Ніж» — <b>niż<\/b>.<br>Для довгих слів — <b>bardziej / najbardziej<\/b>: bardziej interesujący.","table":[["Звичайний","Вищий","Найвищий"],["tani","tańszy","najtańszy"],["nowy","nowszy","najnowszy"],["ładny","ładniejszy","najładniejszy"],["dobry","lepszy","najlepszy"],["zły","gorszy","najgorszy"],["duży","większy","największy"],["mały","mniejszy","najmniejszy"]],"ex":[["Ten sklep jest tańszy niż tamten.","Цей магазин дешевший, ніж той."],["To najlepsza kawa w mieście.","Це найкраща кава в місті."],["Czuję się lepiej.","Я почуваюся краще."]],"quiz":[["Вищий ступінь від «dobry»?","lepszy"],["«Найдешевший» = ?","najtańszy"],["«Більший, ніж» = ?","większy niż"],["«Краще» (прислівник) = ?","lepiej"]]},{"id":"r32","title":"Наказовий спосіб і прохання","text":"Для «ти» форму беруть з 3-ї особи, відкидаючи закінчення: czyta → <b>czytaj<\/b>, robi → <b>rób<\/b>, pisze → <b>pisz<\/b>, idzie → <b>idź<\/b>. Для «ми» додаємо <b>-my<\/b>, для «ви» — <b>-cie<\/b>: chodźmy, czytajcie.<br>Неправильні: być → bądź, jeść → jedz, mieć → miej.<br>Ввічливо (pan/pani): <b>Proszę + інфінітив<\/b>: Proszę usiąść.<br>Заборона — переважно з недоконаним видом: Nie martw się!","table":[["Інфінітив","Ти","Ми","Ви"],["czekać","czekaj","czekajmy","czekajcie"],["robić","rób","róbmy","róbcie"],["iść","idź","chodźmy","idźcie"],["pisać","pisz","piszmy","piszcie"],["być","bądź","bądźmy","bądźcie"]],"ex":[["Poczekaj chwilę!","Зачекай хвилинку!"],["Proszę usiąść.","Сідайте, будь ласка."],["Chodźmy do kina!","Ходімо в кіно!"],["Nie martw się!","Не хвилюйся!"]],"quiz":[["«Читай!» = ?","Czytaj!"],["Ввічливо: «Зачекайте, будь ласка» = ?","Proszę poczekać."],["«Ходімо!» = ?","Chodźmy!"],["«Будь обережний!» = ?","Bądź ostrożny! / Uważaj!"]]},{"id":"r33","title":"Умовний спосіб: chciałbym, mógłby pan","text":"Утворюється з форми минулого часу + <b>by<\/b> + закінчення особи: chciał + by + m = <b>chciałbym<\/b> — я хотів би. Жінки кажуть <b>chciałabym<\/b>.<br>Це найввічливіший спосіб просити: <i>Chciałbym kawę.<\/i> <i>Czy mógłby pan…?<\/i> <i>Czy mogłaby pani…?<\/i>","table":[["Особа","Чоловік","Жінка"],["ja","chciałbym","chciałabym"],["ty","chciałbyś","chciałabyś"],["on / ona","chciałby","chciałaby"],["pan / pani","mógłby pan","mogłaby pani"]],"ex":[["Chciałbym zapłacić.","Я хотів би заплатити."],["Czy mógłby mi pan pomóc?","Чи не могли б ви мені допомогти?"],["Chciałabym umówić się na wizytę.","Я хотіла б записатися на прийом."]],"quiz":[["«Я хотів би» (чоловік) = ?","chciałbym"],["«Я хотіла б» (жінка) = ?","chciałabym"],["Як ввічливо попросити жінку повторити?","Czy mogłaby pani powtórzyć?"],["«Я поїхав би» (чоловік) = ?","pojechałbym"]]},{"id":"r34","title":"Присвійні займенники","text":"<b>mój, twój, nasz, wasz<\/b> змінюються за родом: mój dom, moja kawa, moje okno. <b>jego, jej, ich<\/b> — не змінюються ніколи.<br><b>swój<\/b> — «свій», коли власник — підмет речення: <i>Mam swój pokój<\/i>. Як і в українській!","table":[["Чоловічий","Жіночий","Середній"],["mój","moja","moje"],["twój","twoja","twoje"],["nasz","nasza","nasze"],["wasz","wasza","wasze"],["jego / jej / ich","jego / jej / ich","jego / jej / ich"]],"ex":[["To jest moja żona.","Це моя дружина."],["Gdzie jest twój telefon?","Де твій телефон?"],["To jest ich mieszkanie.","Це їхня квартира."],["Zgubiłem swój klucz.","Я загубив свій ключ."]],"quiz":[["«Моя сестра» = ?","moja siostra"],["«Наше місто» = ?","nasze miasto"],["«Її машина» = ?","jej samochód"],["«Твоє вікно» = ?","twoje okno"]]}];
